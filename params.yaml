# Pure Pursuit Parameters (drone_pure_pursuit_node)
# DWA로 local_goal을 전달하는 구조

# --- 경로 ---
csv_path: ""                  # CSV 파일 절대 경로 (launch 파일에서 override 권장)
frame_id: "map"
default_altitude: 3.0         # CSV에 z 없을 때 사용할 고도 (m)
force_path_altitude: false    # true: CSV z 무시하고 default_altitude 고정

# --- Lookahead ---
use_adaptive_lookahead: true  # true: 속도에 비례한 adaptive lookahead
lookahead_gain: 1.0           # adaptive: Ld = gain * speed_xy
lookahead_min: 1.5            # adaptive lookahead 최솟값 (m)
lookahead_max: 5.0            # adaptive lookahead 최댓값 (m)
lookahead_distance: 1.5       # use_adaptive_lookahead: false 일 때 고정값 (m)

# --- 목표 도달 판정 ---
goal_tolerance_xy: 0.5        # 최종 목표 XY 허용 오차 (m)
goal_tolerance_z:  0.8        # 최종 목표 Z 허용 오차 (m)

# --- 토픽 ---
goal_topic: "/pure_pursuit/local_goal"        # DWA가 구독하는 목표점 토픽
final_reached_topic: "/pure_pursuit/final_reached"

# --- 루프 ---
publish_rate: 20.0            # 목표점 발행 주기 (Hz)
pose_timeout: 0.5             # 포즈 수신 타임아웃 (s)

# --- 경로 탐색 ---
nearest_search_back_segments: 5  # 단조 진행 보장용 backward 탐색 허용 세그먼트 수
